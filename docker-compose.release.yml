# ─────────────────────────────────────────────────────────────────────────────
#  Portfolio (Robinhood) — release stack
#
#  This is what install.sh downloads onto a machine as docker-compose.yml. It
#  pulls prebuilt images and never compiles anything, so a Raspberry Pi goes
#  from nothing to running in about a minute — no Node, no Python, no Git, no
#  pm2, and no clone of this repository.
#
#  Folder it lives in:
#
#      portfolio-robinhood/
#      ├── docker-compose.yml
#      ├── .env                # TZ, UID, GID, port — no secrets
#      ├── data/               # the shared diode: bridge writes, dashboard reads
#      └── bridge-state/       # .env, credentials.env, inboxes, .tokens/ (the saved session)
#
#  The project name and the port are deliberately NOT the Schwab stack's
#  (portfolio-manager, 3000), so both run side by side on one machine and the
#  account switcher's Schwab ⇄ Robinhood link keeps working.
#
#  Why data/ is mounted at /app/data in BOTH services: the dashboard writes
#  APP_DATA_DIR into the bridge's .env using the path the DASHBOARD container
#  sees. The bridge must find that same folder at that same absolute path.
# ─────────────────────────────────────────────────────────────────────────────

name: portfolio-robinhood

services:
  dashboard:
    image: ghcr.io/justintimefordinner-lang/portfolio-dashboard-robinhood:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${DASHBOARD_PORT:-3001}:3000"
    environment:
      # Where the app deposits the sign-in, interval settings and requests.
      AM_REPORT_BRIDGE_DIR: /bridge-state
      NODE_ENV: production
      TZ: ${TZ:-America/Denver}
    volumes:
      - ./data:/app/data
      - ./bridge-state:/bridge-state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  bridge:
    image: ghcr.io/justintimefordinner-lang/portfolio-bridge-robinhood:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      TZ: ${TZ:-America/Denver}
      PYTHONUNBUFFERED: "1"
      # Works before Settings has ever been opened; the dashboard later writes
      # the same path into bridge-state/.env.
      APP_DATA_DIR: /app/data
    volumes:
      # Persistent state. /state is the bridge's working directory AND its home
      # folder, so .env, credentials.env, the inboxes and .tokens/robinhood.pickle
      # are real files here and the Robinhood session outlives the container.
      - ./bridge-state:/state
      # Same absolute path the dashboard uses. See the note at the top.
      - ./data:/app/data

# No port is published for the bridge, and none is needed: a Robinhood login is
# approved from the Robinhood app on your phone (or an authenticator key), so
# nothing ever listens.

  # Applies updates requested from Settings → "Update now". A stock Docker CLI
  # with the host's Docker socket, so it can pull and recreate THIS project's
  # containers; it is told the project name and never touches anything else.
  # It has to run as root for the socket, which is the same trust as any Docker
  # management tool. It does nothing until the dashboard drops
  # data/update-request, and reports back through data/update-status.json.
  updater:
    image: docker:28-cli
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT_NAME: portfolio-robinhood
    # The install folder at the SAME path as on the host, so the compose file's
    # relative mounts (./data, ./bridge-state) resolve to the host folders when
    # compose runs from inside this container. install.sh writes STACK_DIR.
    working_dir: ${STACK_DIR:-/stack}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACK_DIR:-/stack}:${STACK_DIR:-/stack}
    entrypoint: ["sh", "-c"]
    command:
      - |
        marker=data/update-request; status=data/update-status.json
        report() { printf '{"status":"%s","message":%s,"updatedAt":"%s"}\n' "$$1" "$$2" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$$status.tmp" && mv "$$status.tmp" "$$status"; }
        echo "updater: watching $$(pwd)/$$marker"
        while true; do
          if [ -f "$$marker" ]; then
            rm -f "$$marker"
            echo "updater: update requested"
            report running null
            if out=$$(docker compose pull 2>&1) && out2=$$(docker compose up -d --remove-orphans 2>&1); then
              report done null
              echo "updater: done"
            else
              msg=$$(printf '%s\n%s' "$$out" "$$out2" | tail -n 3 | tr -d '"\' | tr '\n' ' ')
              report error "\"$$msg\""
              echo "updater: FAILED: $$msg"
            fi
          fi
          sleep 10
        done
